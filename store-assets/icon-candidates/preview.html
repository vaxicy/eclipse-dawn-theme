95<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Eclipse Dawn — Logo 方案预览</title>
<style>
  body { background:#111119; color:#ecedee; font-family:system-ui,"Segoe UI",Arial,sans-serif; margin:0; padding:36px; }
  h1 { font-weight:600; margin:0 0 6px; }
  p.sub { color:#9a9ab0; margin:0 0 26px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:960px; }
  .card { background:#1b1b26; border:1px solid #2c2c3e; border-radius:14px; padding:18px; text-align:center; }
  .card img { width:100%; max-width:180px; display:block; margin:0 auto 12px; border-radius:6px; }
  .num { color:#aecbd6; font-variant-numeric:tabular-nums; font-weight:600; }
  .name { margin-top:4px; font-size:13px; color:#b9b9cc; word-break:break-all; }
</style>
</head>
<body>
  <h1>Eclipse Dawn Theme — Logo 方案</h1>
  <p class="sub">圆角矩形渐变底 + 日蚀主体。回复编号（如「3」）即可定为最终 logo。</p>
  <div class="grid">
    <div class="card"><img src="logo-01-eclipse.png" alt=""><div class="num">01</div><div class="name">标识 · 日蚀</div></div>
    <div class="card"><img src="logo-02-dawn-rise.png" alt=""><div class="num">02</div><div class="name">晨光升起</div></div>
    <div class="card"><img src="logo-03-rings.png" alt=""><div class="num">03</div><div class="name">轨道环</div></div>
    <div class="card"><img src="logo-04-halo.png" alt=""><div class="num">04</div><div class="name">光晕</div></div>
    <div class="card"><img src="logo-05-crescent.png" alt=""><div class="num">05</div><div class="name">暖弧新月</div></div>
    <div class="card"><img src="logo-06-starry.png" alt=""><div class="num">06</div><div class="name">星空</div></div>
  </div>
</body>
</html>
